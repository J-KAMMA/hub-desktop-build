[package]
name = "hub-local-runner"
version = "0.1.0"
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "hub_local_runner"
path = "src/lib.rs"

[[bin]]
name = "hub-local-runner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
aes-gcm = "0.10"
aes = "0.8"
axum = { version = "0.7", features = ["json", "macros"] }
base64 = "0.22"
png = "=0.17.16"
chrono = "0.4"
rand = "0.8"
# ノードの身元鍵。ハブの Federation Gateway が ECDSA P-256 / SHA-256 /
# base64url で検証し、公開鍵は JWK で受け取る（apps/federation/src/personal-node.ts）。
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
# エージェント支出 grant に紐付けるセッション鍵。EVM アカウントなので
# secp256k1 + keccak でアドレスを導く（身元鍵の p256 とは別物）。
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
# webview-data-url: 配信元へ届かないときに、こちらで作った説明の頁を窓へ渡す。
# 無いと WebView の英語のエラー頁が出るだけで、アプリが壊れたようにしか見えない。
# unstable: ブラウザ窓の子webview（window.add_child）に必要。公開するAPI面は増やさない。
tauri = { version = "2", features = ["unstable", "webview-data-url"] }
tauri-plugin-dialog = "2"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.5", features = ["cors", "limit"] }
uuid = { version = "1", features = ["serde", "v4"] }
unicode-normalization = "0.1"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }

# keyring 3 は機能を指定しないと、実体がメモリ上の偽の保管庫になる。プロセスが
# 終われば鍵が消え、暗号化して保存した記録を次の起動で誰も読めなくなる。台ごとの
# 保管庫を名指しする。
[target.'cfg(windows)'.dependencies]
toml = "1.1.3"
windows-sys = { version = "0.59", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
keyring = { version = "3", features = ["windows-native"] }
# ブラウザ窓の戻る/進む/再読み込みは子webviewのコントローラ経由で
# WebView2 ネイティブAPIを呼ぶ（wryのevalは子webviewには届かない）。
webview2-com = "0.38"
# 非表示タブのメモリ削減で ICoreWebView2 を _3 へキャストするのに使う。
windows-core = "0.61"
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
